name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} (lockfile versions)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node lines allowed by package.json "engines" (same as ESLint 10).
        node: [20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  peer-compat:
    name: ESLint ${{ matrix.eslint }} + template-parser ${{ matrix.parser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest versions allowed by peerDependencies.
          - { eslint: 10.0.0, parser: 21.3.0 }
          - { eslint: 10.0.0, parser: 22.0.0 }
          # Latest release of the previous angular-eslint major.
          - { eslint: 10, parser: 21 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint }} @angular-eslint/template-parser@${{ matrix.parser }}
      - run: npx eslint --version
      - run: npm test
